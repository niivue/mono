<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>OME-Zarr multiscale stores</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      #panel {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      #url {
        min-width: 18rem;
        flex: 1 1 18rem;
      }
      #channels {
        display: flex;
        flex-wrap: wrap;
        gap: 0.15rem 0.75rem;
        padding: 0.2rem 0;
      }
      #channels label {
        font-size: 0.8rem;
        white-space: nowrap;
      }
      /* Keep each checkbox glued to its own label when the row wraps. */
      .pair {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        white-space: nowrap;
      }
      #timepoint {
        width: 4rem;
      }
      #credit {
        font-size: 0.75rem;
        opacity: 0.8;
      }
      #status {
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="panel">
        <label for="sample">Store</label>
        <select id="sample"></select>
        <input id="url" type="text" placeholder="or a URL to a .ome.zarr" />
        <button id="fetchUrl" type="button">Fetch</button>
        <label for="level">Level</label>
        <select id="level" disabled></select>
        <label for="view">View</label>
        <select id="view">
          <option value="3" selected>multiplanar</option>
          <option value="0">axial</option>
          <option value="1">coronal</option>
          <option value="2">sagittal</option>
          <option value="4">3D render</option>
        </select>
        <span class="pair" id="timepointPair" hidden>
          <label for="timepoint">Timepoint</label>
          <input id="timepoint" type="number" min="0" value="0" />
        </span>
        <label for="opacity">Overlay opacity</label>
        <input
          id="opacity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.5"
        />
        <span class="pair">
          <label for="webgpuCheck">WebGPU</label>
          <input type="checkbox" id="webgpuCheck" checked />
        </span>
      </div>
      <div id="credit"></div>
      <div id="channels"></div>
      <button id="load" type="button" disabled>Load selected channels</button>
      <div id="status">&nbsp;</div>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="./ome.zarr.js"></script>
  </body>
</html>
