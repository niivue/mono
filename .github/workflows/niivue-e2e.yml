name: niivue browser contracts

# Contracts that only a real browser can hold: the behaviour under test lives
# in a Web Worker or on the GPU, which the Bun unit runner does not have.
#
#   partial-decode-4d   `limitFrames4D` must bound DECODING, not just retention.
#                       It was retention-only on both load paths, and a 4D
#                       preview peaked at 1.1 GB RSS for one 1.5 MB frame.
#   reader-name-override  a caller-supplied `name` must reach `reader.read`;
#                       MGH and VMR change behaviour on it.
#   texcache-kind-change  a volume that stops being chunked must drop its
#                       bricks. The entry used to leak for the life of the
#                       renderer, holding every brick texture (issue #145).
#                       All three build their data in the page: no LFS.
#   render-*            every scene matches its committed reference PNGs
#                       (render-reference and the feature groups beside it).
#                       The references are shared by all platforms, so running
#                       them here on SwiftShader as well as on Metal below is
#                       what keeps one set valid for both renderers. Synthetic
#                       data only, no LFS. Their WebGPU cases skip, not fail,
#                       if the software device is lost. They run in their own
#                       job, sharded: one worker on SwiftShader takes ~4 min.
#
# Narrow on purpose. The rest of the e2e suite needs a GPU adapter that the
# Ubuntu runners do not have; it runs in full-suite-metal below instead.
# These are deterministic without one: the first two never touch
# the GPU, and texcache-kind-change forces `--use-angle=swiftshader` for its
# WebGL2 case, which is the case that was proven to fail on main. Its WebGPU
# case skips here. `requestAdapter()` does succeed on the runner, but the GPU
# instance dies partway through, so the spec skips on GPU-loss errors only; a
# validation error from a destroyed texture, the failure it exists to catch,
# still fails. `--workers=1` because two Chromium instances sharing one
# software GPU were what killed the instance.

on:
  push:
    branches: [main]
    # Markdown (READMEs, docs/, CHANGELOGs) changes no tested code, so a
    # docs-only change does not queue the macOS job. Negations must come last.
    paths:
      - 'packages/niivue/**'
      - 'packages/uikit/**'
      - 'packages/dev-images/**'
      - '.github/workflows/niivue-e2e.yml'
      - '!**/*.md'
  pull_request:
    # labeled/unlabeled let the skip-metal label cancel or restore the Metal job.
    # Adding or removing any label restarts the run (cancel-in-progress below).
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'packages/niivue/**'
      - 'packages/uikit/**'
      - 'packages/dev-images/**'
      - '.github/workflows/niivue-e2e.yml'
      - '!**/*.md'

permissions:
  contents: read

# A new push to a PR cancels its stale run (the macOS job takes ~10 min). Every
# main push gets its own group, because a shared group holds only one pending
# run and replaces it even with cancel-in-progress off, which would drop the
# Metal result for a merge that landed while another was queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    steps:
      # No LFS: these specs build their volumes in the page.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Only the headless shell: these specs never launch full Chromium. No
      # --with-deps: the runner image already has Chromium's libraries, and the
      # fonts it would add (one run spent 5 min on a slow apt mirror) are not
      # used. A missing library fails the launch with Playwright's own message.
      - name: Install Playwright chromium
        working-directory: packages/niivue
        run: bunx playwright install --only-shell chromium

      - name: Browser contracts
        working-directory: packages/niivue
        run: |
          bunx playwright test \
            e2e/partial-decode-4d.spec.ts \
            e2e/reader-name-override.spec.ts \
            e2e/texcache-kind-change.spec.ts \
            --workers=1 \
            --reporter=line

  # The render-* reference specs on SwiftShader (see the header). Sharded so
  # the single-worker run stays short; synthetic data, so no LFS pull.
  render-references:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: packages/niivue
        run: bunx playwright install --only-shell chromium

      - name: Render references (shard ${{ matrix.shard }}/4)
        working-directory: packages/niivue
        run: |
          bunx playwright test e2e/render- \
            --shard=${{ matrix.shard }}/4 \
            --workers=1 \
            --reporter=line

  # The full suite on real Metal (issue #199). Free macOS runners expose a
  # paravirtual GPU, but only full Chromium reaches it; the headless shell stays
  # on SwiftShader. PLAYWRIGHT_CHROMIUM_CHANNEL switches e2e/launchOptions.ts to
  # that mode. The VM is small (3 cores, 7 GB): a correctness gate, not timing.
  #
  # A PR skips it when labeled skip-metal AND its head commit has a passing
  # local-metal status from bun .github/scripts/local-metal.ts <pr>. The status
  # is per commit, so a later push runs Metal again. Pushes to main always run it.
  metal-gate:
    # Only labelled PRs; skipped elsewhere, its empty output runs Metal.
    if: contains(github.event.pull_request.labels.*.name, 'skip-metal')
    runs-on: ubuntu-latest
    permissions:
      statuses: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          # An API error reads as no local pass, so Metal runs.
          state=$(gh api "repos/$REPO/commits/$SHA/status" \
            -q '.statuses[] | select(.context == "local-metal") | .state' || true)
          skip=false
          [ "$state" = success ] && skip=true
          echo "local-metal=${state:-none} skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  full-suite-metal:
    needs: metal-gate
    # !cancelled(): a skipped or failed gate must not skip Metal.
    if: ${{ !cancelled() && needs.metal-gate.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
      # Serve a build, not the dev server: see packages/niivue/vite.config.e2e.ts.
      E2E_BUNDLE: '1'
    steps:
      # All of dev-images, unlike the job above: the full suite reads ~17
      # assets and an include list would rot as specs are added.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Keyed on the lockfile, which pins the Playwright (and so Chromium) version.
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # --no-shell: Metal launches full Chromium only (PLAYWRIGHT_CHROMIUM_CHANNEL).
      - name: Install Playwright chromium
        working-directory: packages/niivue
        run: bunx playwright install --no-shell chromium

      # e2e/uikit-overlay-hook.spec.ts imports the built bundle. Vite directly,
      # not `nx build uikit`, which builds niivue first (~25 s) for nothing:
      # the bundle keeps @niivue/niivue external.
      - name: Build uikit
        working-directory: packages/uikit
        run: bunx --bun vite build

      # E2E_COVERAGE: browser JS coverage to coverage-e2e/lcov.info (e2e/coverage.ts).
      # About +30% on the suite's time locally (most of it in demo-smoke).
      - name: Full e2e suite
        working-directory: packages/niivue
        env:
          E2E_COVERAGE: '1'
        # test:e2e:metal is where Metal-only exclusions go (none at present).
        run: bun run test:e2e:metal --workers=2

      # Bun's unit coverage (~6 s) for the merged report below. pr_gate.yml is
      # the gate for these tests; a failure here only loses the unit column.
      - name: Unit coverage for the merged report
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: packages/niivue
        run: bun test > /dev/null

      # Report only, no threshold. Skipped with the job when local-metal stands in.
      - name: Coverage summary (unit + browser)
        if: ${{ !cancelled() }}
        working-directory: packages/niivue
        run: bun run coverage:merge

      # GPU specs skip rather than fail when an adapter or backend is missing,
      # so a green run with skips may have tested very little. Tests excluded
      # by test:e2e:metal are not run and so are not counted here.
      - name: Fail on skipped tests
        run: bun .github/scripts/check-no-skipped-tests.ts packages/niivue/test-results/results.json

      # Per-test timings on every run, for comparing CI speed across changes.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-metal
          path: packages/niivue/test-results/results.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-metal
          path: |
            packages/niivue/coverage-e2e/lcov.info
            packages/niivue/coverage-merged/lcov.info
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-metal
          path: packages/niivue/playwright-report/
          retention-days: 7
