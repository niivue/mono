name: "niivue: Codespell"

on:
  push:
    branches: [main]
    paths:
      - "packages/niivue/**"
  # Every PR, including stacked ones; `edited` re-runs it on a manual retarget (#487).
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "packages/niivue/**"

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    # An `edited` event counts only when the base branch changed (a retarget).
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Annotate locations with typos
        uses: codespell-project/codespell-problem-matcher@v1

      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          path: packages/niivue
          ignore_words_list: aNormal,inout,aLo,hAx,LOD,mater,lod,nd
