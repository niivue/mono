<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue Document Copy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <b>Top</b>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      <label for="colormapSelect">Colormap</label>
      <select id="colormapSelect"></select>
      <button type="button" id="topToBottom">Copy Top to Bottom</button>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <header>
      <b>Bottom</b>
      <label for="shaderSelect">Mesh shader</label>
      <select id="shaderSelect"></select>
      <label for="azimuth">Azimuth</label>
      <input type="range" id="azimuth" min="0" max="360" value="110" />
      <button type="button" id="bottomToTop">Copy Bottom to Top</button>
    </header>
    <main id="canvas-container">
      <canvas id="gl2"></canvas>
    </main>
    <footer id="copyStatus">&nbsp;</footer>
    <script type="module" src="document.copy.js"></script>
  </body>
</html>
