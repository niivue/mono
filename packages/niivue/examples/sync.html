<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue Synchronize</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <label for="dataset">Data</label>
      <select id="dataset">
        <option value="brain" selected>MNI152 brain and mesh</option>
        <option value="cells">Allen hiPSC interphase, 4 channels</option>
      </select>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      <label for="broadcastSelect"> Broadcast</label>
      <select id="broadcastSelect">
        <option value="0">Independent</option>
        <option value="1">Top Controls Bottom</option>
        <option value="2">Bottom Controls Top</option>
        <option value="3" selected>Bidirectional</option>
      </select>
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
      <button type="button" id="aboutBtn">About</button>
    </header>
    <!-- Microscopy only: each pane keeps its own channel settings while the camera is linked. -->
    <header id="channelControls" hidden>
      <span>Top:</span>
      <select id="topChannel"></select>
      <label><input type="checkbox" id="topVisible" checked /> visible</label>
      <label>window <input type="range" id="topWindow" min="1" max="255" /></label>
      <span>Bottom:</span>
      <select id="bottomChannel"></select>
      <label><input type="checkbox" id="bottomVisible" checked /> visible</label>
      <label>window <input type="range" id="bottomWindow" min="1" max="255" /></label>
      <span id="cellCredit"></span>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <main id="canvas-container">
      <canvas id="gl2"></canvas>
    </main>
    <script type="module" src="sync.js"></script>
  </body>
</html>
