<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Live Data Updates</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <label for="voxelCheck">Animate voxels</label>
      <input type="checkbox" id="voxelCheck" checked />
      &nbsp;
      <label for="meshCheck">Animate mesh</label>
      <input type="checkbox" id="meshCheck" checked />
      &nbsp;
      <label for="speedSlider">Speed</label>
      <input type="range" id="speedSlider" min="1" max="20" value="6" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck" checked />
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="stats">&nbsp;</footer>
    <script type="module" src="./live.data.js"></script>
  </body>
</html>
