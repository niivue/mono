name: Release

# Two ways to release:
#
# 1. Automatic release candidates. Every push to main (normally a merged PR)
#    runs `nx release` with the `rc` preid. Any package with releasable
#    conventional commits gets a new `<project>@<x.y.z>-rc.N` tag, a GitHub
#    pre-release, and an npm publish under the `next` dist-tag. A merge with
#    nothing releasable (docs, apps, CI) is a no-op.
#
# 2. Manual stable releases. Run this workflow from the Actions tab with the
#    "release candidate" box unchecked to cut the real `x.y.z` versions and
#    publish them under the npm `latest` dist-tag. Stable releases are never
#    created automatically. Checking the box gives a manual RC run, which is
#    the same as what a push does.
#
# Nx pushes the `chore(release): publish` commit with RELEASE_TOKEN (a PAT),
# so that push does trigger this workflow again. The job-level `if` skips
# that run instead of releasing twice.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the plan without creating commits or tags)"
        type: boolean
        default: false
      rc:
        description: "Create release candidate versions (for example, 1.2.3-rc.0) and publish them with the npm 'next' tag. Leave unchecked for a stable release. Pushes to main already do this automatically."
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: nx release
    runs-on: ubuntu-latest
    # workflow_dispatch can be triggered from any branch. Guard against
    # accidentally force-pushing a feature branch to main. Also skip the push
    # event for the release commit this workflow creates itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): publish'))
    env:
      # A push to main is always an RC. A manual run is an RC only when the
      # box is checked. `inputs.*` is empty on push events.
      RELEASE_RC: ${{ github.event_name == 'push' || inputs.rc == true }}
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Release the current tip of main rather than the pushed SHA. When
          # two PRs merge close together, the queued run would otherwise check
          # out an older commit and its push would be rejected.
          ref: main
          fetch-depth: 0
          lfs: true
          # Use an admin PAT so `git push` can bypass the main ruleset
          # (repo admins are listed as bypass actors). Falls back to the
          # workflow-scoped GITHUB_TOKEN if the secret is unset.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Configure git identity
        # Uses the official github-actions[bot] noreply address (user id 41898282).
        # This attributes release commits to the bot in the GitHub UI with its avatar.
        run: bun .github/scripts/configure-release-git.ts

      - name: Release (dry run)
        if: env.RELEASE_DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: bun .github/scripts/run-typescript-release.ts --dry-run ${{ env.RELEASE_RC == 'true' && '--rc' || '' }}

      - name: Release
        id: release
        if: env.RELEASE_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        # When no package has releasable commits, Nx creates no commit and no
        # tags. The script sets `created=false` and the remaining steps are
        # skipped, so a rerun at an existing release commit does not republish
        # the tags already pointing at HEAD.
        run: bun .github/scripts/run-typescript-release.ts ${{ env.RELEASE_RC == 'true' && '--rc' || '' }}

      - name: Push release commit and tags
        if: env.RELEASE_DRY_RUN != 'true' && steps.release.outputs.created == 'true'
        run: bun .github/scripts/push-release-commit.ts

      - name: Create GitHub Releases
        if: env.RELEASE_DRY_RUN != 'true' && steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        # For each tag Nx created at HEAD, create (or update, if rerunning) a
        # matching GitHub Release whose body is the project's freshly-written
        # CHANGELOG.md top section.
        run: bun .github/scripts/create-github-releases.ts

      - name: Publish to npm
        if: env.RELEASE_DRY_RUN != 'true' && steps.release.outputs.created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: bun .github/scripts/publish-npm-packages.ts
