<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue - Matcap</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      /* The matcap sphere, at the size it is actually sampled: a lookup keyed
         by the surface normal, so the image IS the lighting model. */
      #matcapImg {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        vertical-align: middle;
        border: 1px solid #888;
        background: #222;
      }
    </style>
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4" selected>Render</option>
        <option value="3">A+C+S+R</option>
      </select>
      &nbsp;
      <select id="volumeSelect">
        <option selected>mni152</option>
        <option>sphere</option>
        <option>shear</option>
      </select>
      &nbsp;
      <label for="matcapSelect">Matcap</label>
      <select id="matcapSelect">
        <option>Cortex</option>
        <option>Shiny</option>
      </select>
      <img id="matcapImg" alt="the selected matcap" />
      <input type="range" min="0" max="100" value="100" class="slider" id="gradSlider" />
      &nbsp;
      <label for="colormapSelect">Colormap</label>
      <select id="colormapSelect"></select>
      &nbsp;
      <label for="xrayCheck">XRay</label>
      <input type="checkbox" id="xrayCheck" checked />
      &nbsp;
      <label for="darkCheck">Clip Dark</label>
      <input type="checkbox" id="darkCheck" />
      &nbsp;
      <label for="colorBtn">Background</label>
      <input type="color" id="colorBtn" value="#333333" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">NiiVue</footer>
    <script type="module" src="vox.matcap.js"></script>
  </body>
</html>
