<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue Allen Mouse CCF</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <label for="opacitySlider">Opacity</label>
      <input type="range" min="0" value="50" max="100" class="slider" id="opacitySlider" />
      &nbsp;
      <label for="legendCheck">Legend</label>
      <input type="checkbox" id="legendCheck" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck" />
      &nbsp;
      <button type="button" id="saveBtn">Save scene</button>
      <button type="button" id="aboutBtn">About</button>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">Loading the Allen CCF 25 um template and annotation...</footer>
    <script type="module" src="allen.ccf.js"></script>
  </body>
</html>
