<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Tissue Blending</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      .sliders { display: inline-flex; gap: 14px; align-items: center; }
      .sliders label { display: inline-flex; gap: 5px; align-items: center; }
      .swatch { width: 11px; height: 11px; border: 1px solid #888; display: inline-block; }
      .sliders input[type='range'] { width: 92px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <span class="sliders">
        <label for="bg">T1<input type="range" id="bg" min="0" max="100" value="100" /></label>
        <label for="gm"><span class="swatch" style="background:#e06868"></span>GM<input type="range" id="gm" min="0" max="100" value="70" /></label>
        <label for="wm"><span class="swatch" style="background:#fafafa"></span>WM<input type="range" id="wm" min="0" max="100" value="70" /></label>
        <label for="csf"><span class="swatch" style="background:#78a0ff"></span>CSF<input type="range" id="csf" min="0" max="100" value="70" /></label>
      </span>
      &nbsp;
      <label for="alphaBlend" title="volumeOverlayAlphaBlend: how overlapping maps combine opacity">Blend</label>
      <select id="alphaBlend">
        <option>max</option>
        <option selected>additive</option>
        <option>union</option>
      </select>
      <select id="colorBlend" title="volumeOverlayColorBlend: how overlapping maps combine colour">
        <option selected>add colors</option>
        <option>mean color</option>
        <option>over (last map on top)</option>
        <option>max color</option>
      </select>
      &nbsp;
      <label for="gradSlider"
        title="volumeIllumination: matcap lighting in the 3D render, from the volume's gradient">Shading</label>
      <input type="range" min="0" max="100" value="40" class="slider" id="gradSlider" />
      &nbsp;
      <label title="isViewModeHotKeyEnabled: press V to cycle the view"><input type="checkbox" id="viewKey" />V key</label>
      &nbsp;
      <label title="volumeIsNearestInterpolation: show voxel boundaries rather than smoothing them"><input type="checkbox" id="nearestCheck" />Nearest</label>
      &nbsp;
      <label for="xrayCheck">XRay</label>
      <input type="checkbox" id="xrayCheck" checked />
      &nbsp;
      <label for="colorBtn">Background</label>
      <input type="color" id="colorBtn" value="#000000" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="vox.tissues.js"></script>
  </body>
</html>
