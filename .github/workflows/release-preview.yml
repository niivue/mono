name: Release Preview

on:
  # Main-based PRs only: the preview is computed against main. `edited` runs it
  # when a stacked PR is retargeted to main by hand (#487).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

concurrency:
  # A title or body edit gets its own group, so it cannot cancel a real run.
  group: release-preview-${{ github.event.pull_request.number }}${{ (github.event.action == 'edited' && !github.event.changes.base) && '-edit' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    # A skipped title/body-edit run gets its own check name, so it never
    # replaces this check's real result on the PR.
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Preview nx release (edit, skipped)' || 'Preview nx release' }}
    # An `edited` event counts only when the base branch changed (a retarget).
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Run nx release (dry run)
        id: dry_run
        run: |
          set -o pipefail
          bunx nx release --dry-run --skip-publish --verbose 2>&1 | tee release-preview.txt

      - name: Format preview comment
        run: bun .github/scripts/format-release-preview.ts release-preview.txt > preview-comment.md

      # The comment is posted by release-preview-comment.yml, not here. A
      # pull_request run from a fork gets a read-only token however the
      # permissions block reads, so this job cannot comment on external PRs.
      # It hands the rendered comment and the PR number to a workflow_run job
      # that runs in the base repo's context instead.
      - name: Record the PR number
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: |
            preview-comment.md
            pr-number.txt
          retention-days: 1
