<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@niivue/uikit - Ruler on the WSI viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee;
        font: 14px/1.4 system-ui, sans-serif; }
      #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
      header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333;
        display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
      header b { color: #ffd500; }
      button { background: #333; color: #eee; border: 1px solid #555;
        border-radius: 4px; padding: 3px 9px; cursor: pointer; }
      #canvasHolder { flex: 1; position: relative; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%;
        touch-action: none; }
      a { color: #ffd500; }
    </style>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div id="wrap">
      <header>
        <b>UIKit</b>
        <nav><a href="./index.html">controls</a><a href="./ruler.html">ruler</a><a href="./volume.html">volume</a><a href="./slide.html">slide (3D)</a><a href="./slide-wsi.html" aria-current="page">WSI</a><a href="./buttons.html">buttons</a></nav>
        <button id="fit" type="button">Fit</button>
        <label>font <input id="fontSize" type="range" min="12" max="72" value="24" style="vertical-align:middle" /></label>
        <label>slide <select id="srcSelect">
          <option value="cptac">tissue</option>
          <option value="dzi">demo</option>
        </select></label>
        <label title="A lens following the pointer"><input id="magnify" type="checkbox" autocomplete="off" /> magnifier</label>
        <label class="backend">backend <select id="backendSelect">
          <option value="webgpu">webgpu</option>
          <option value="webgl2">webgl2</option>
        </select></label>
        <label title="Multisample anti-aliasing (reloads the page)">AA <select id="aaSelect">
          <option value="on">on</option>
          <option value="off">off</option>
        </select></label>
        <label>interp <select id="filter" autocomplete="off">
          <option value="linear">linear</option>
          <option value="nearest">nearest</option>
        </select></label>
        <label id="retinaLabel" hidden title="Native device pixels (off: one canvas pixel per CSS pixel)"><input id="retina" type="checkbox" checked autocomplete="off" /> Retina</label>
      </header>
      <div id="canvasHolder"><canvas id="gl"></canvas></div>
      <footer><span id="help">Drag to pan, wheel to zoom. Click two points to measure. Drag the minimap to jump.</span><span id="status" data-state="wait">Loading slide...</span><span id="credit"></span></footer>
    </div>

    <script type="module">
      import { createSlideView, DRAG_MODE, DziSource, NVSlide } from '@niivue/niivue'
      import {
        attachSlideMagnifier,
        attachSlideMinimap,
        loadDefaultFont,
        UIKitRulerOverlay,
      } from './src/index.ts'
      import { setStatus } from './statusBar.js'
      import { urlParamSelect } from './urlParamSelect.js'

      // Real tissue from NiiVue's test-images repo (hosted live on GitHub Pages,
      // which serves HTTP Range + CORS), plus a CORS-enabled Deep Zoom fallback.
      // The DICOM-WSI reports base slide pixels (its PixelSpacing is [1,1]); a
      // slide that carried real spacing would read in millimetres instead.
      const WSI_BASE = 'https://niivue.github.io/niivue-demo-images/wsi'
      const DZI = 'https://openseadragon.github.io/example-images/highsmith/highsmith.dzi'
      const TISSUE = {
        cptac: `${WSI_BASE}/cptac-brca/manifest.json`, // CPTAC breast-cancer H&E
      }
      const CREDIT = {
        cptac: 'CPTAC-BRCA, The Cancer Imaging Archive, CC BY 4.0 (https://doi.org/10.7937/TCIA.CAEM-YS80)',
        dzi: "OpenSeadragon's home-page demo image (openseadragon.github.io), no licence stated",
      }

      const params = new URLSearchParams(location.search)
      const src = params.get('src') || 'cptac'
      const wantGpu = params.get('backend') !== 'webgl2' && 'gpu' in navigator
      // WebKit (Safari, and every iOS browser) runs WebGPU about 4x slower with anti-aliasing
      // on, so it defaults off there and on elsewhere.
      const isWebKit =
        /AppleWebKit/.test(navigator.userAgent) &&
        !/Chrome|Chromium|Edg\//.test(navigator.userAgent) // iOS Edge (EdgiOS) is WebKit
      const aaParam = new URLSearchParams(location.search).get('aa')
      const isAntiAlias = aaParam ? aaParam === 'on' : !isWebKit
      // Wired before the slide loads, so the menus work even if it fails.
      urlParamSelect(document.getElementById('srcSelect'), 'src', src === 'dzi' ? 'dzi' : 'cptac')
      urlParamSelect(document.getElementById('backendSelect'), 'backend', wantGpu ? 'webgpu' : 'webgl2')
      urlParamSelect(document.getElementById('aaSelect'), 'aa', isAntiAlias ? 'on' : 'off')
      document.getElementById('credit').textContent = CREDIT[src === 'dzi' ? 'dzi' : 'cptac']
      const filter = document.getElementById('filter')
      const retina = document.getElementById('retina')
      const COLOR = [1, 0.85, 0, 1]

      // --- measurement (endpoints stored in SLIDE coords so they track the ----
      // tissue through pan/zoom) --------------------------------------------
      const spacing = () => slide.manifest.pixelSpacingMM // [x,y] mm/px or undefined
      let ruleA = null // {x,y} slide px
      let ruleB = null
      let hover = null // slide px under the pointer while the second click is pending
      let labelSizePx = 24 // ruler label height in px (font-size slider)

      // Physical distance when the slide carries pixel spacing (PixelSpacing /
      // ImagedVolumeWidth): microns for sub-mm features, mm (with per-mm ticks)
      // above that. Falls back to base slide pixels when no spacing is present.
      const measure = (a, b) => {
        const dpx = b.x - a.x
        const dpy = b.y - a.y
        const sp = spacing()
        if (!sp) {
          return { length: Math.hypot(dpx, dpy), units: 'px', decimals: 0, ticks: false }
        }
        const mm = Math.hypot(dpx * sp[0], dpy * sp[1])
        return mm < 1
          ? { length: mm * 1000, units: 'um', decimals: 0, ticks: false }
          : { length: mm, units: 'mm', decimals: 2, ticks: true }
      }

      // slide.slideToScreen is the inverse of slide.screenToSlide (slide base
      // pixel -> canvas CSS); scale to device pixels for the overlay.
      const slideToDevice = (p, screen) => {
        const { xCss, yCss } = slide.slideToScreen(p.x, p.y, screen)
        const dpr = screen.devicePixelRatio ?? 1
        return [xCss * dpr, yCss * dpr]
      }

      // Set the ruler geometry BEFORE the frame draws it.
      const updateRuler = (screen) => {
        const a = ruleA
        const b = ruleB ?? (a && hover)
        if (!a || !b) { ruler.clear(); return }
        const m = measure(a, b)
        ruler.setRuler({
          a: slideToDevice(a, screen), b: slideToDevice(b, screen),
          length: m.length, units: m.units, decimals: m.decimals,
          sizePx: labelSizePx, thickness: 3, showTicks: m.ticks, showTickNumbers: m.ticks,
          lineColor: COLOR, textColor: COLOR,
        })
        setStatus(
          `${m.length.toFixed(m.decimals)} ${m.units}${ruleB ? '' : ' (click to fix)'}`,
          ruleB ? 'ok' : 'wait',
        )
      }

      // --- load + wire ----------------------------------------------------------
      const opts = { maxCacheBytes: 96 * 1024 * 1024 }
      // fromManifestUrl resolves relative tile paths against the manifest URL, so
      // it needs an absolute URL (not a root-relative path).
      const manifestUrl = new URL(TISSUE[src] ?? TISSUE.cptac, location.href).href
      const slide =
        src === 'dzi'
          ? NVSlide.fromSource(await DziSource.fromUrl(DZI), opts)
          : await NVSlide.fromManifestUrl(manifestUrl, opts)
      const font = await loadDefaultFont()
      const ruler = new UIKitRulerOverlay(font)
      // A click places a ruler end, a drag pans, the wheel zooms (no double-click
      // zoom: the primary mode is not pan).
      const view = await createSlideView(document.getElementById('gl'), {
        backend: wantGpu ? 'webgpu' : 'webgl2',
        antialias: isAntiAlias,
        hidpi: retina.checked,
        slide,
        controller: {
          primaryDragMode: DRAG_MODE.crosshairPan,
          onCrosshair: (p) => {
            if (!ruleA || ruleB) { ruleA = p; ruleB = null; hover = null }
            else ruleB = p
            view.requestRender()
          },
          onHover: (p) => {
            if (!ruleA || ruleB) return
            hover = p
            view.requestRender()
          },
        },
        onBeforeRender: updateRuler,
        onRender: () => {
          // Retina is offered only on a HiDPI display (another monitor, browser zoom).
          document.getElementById('retinaLabel').hidden = window.devicePixelRatio <= 1
        },
      })
      document.getElementById('backendSelect').value = view.backend
      view.addOverlay(ruler)
      // The minimap owns presses on itself, so they never reach the pan / measure gestures.
      attachSlideMinimap(view)
      view.renderer.isNearestInterpolation = filter.value === 'nearest'
      setStatus(
        `Waiting for first click (${spacing() ? 'mm' : 'slide px'})`,
        'wait',
      )

      // --- controls ---------------------------------------------------------------
      document.getElementById('fit').addEventListener('click', () => view.fit())
      document.getElementById('fontSize').addEventListener('input', (ev) => {
        labelSizePx = Number(ev.target.value); view.requestRender()
      })
      filter.addEventListener('change', () => {
        view.renderer.isNearestInterpolation = filter.value === 'nearest'; view.requestRender()
      })
      retina.addEventListener('change', () => { view.hidpi = retina.checked })
      // Attached after the minimap, so the lens draws over it.
      let unmagnify = null
      document.getElementById('magnify').addEventListener('change', (ev) => {
        unmagnify?.()
        unmagnify = ev.target.checked ? attachSlideMagnifier(view) : null
        view.requestRender()
      })
    </script>
  </body>
</html>
