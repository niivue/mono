<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue Tract on Sheared Volume</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <label for="slabCheck">Slab</label>
      <input type="checkbox" id="slabCheck" checked/>
      <input type="range" id="slabSlide" min="1" max="20" step="1" value="3" />
      <span id="slabLabel">3 mm</span>
      &nbsp;
      <label for="xrayCheck">XRay</label>
      <input type="checkbox" id="xrayCheck"/>
      &nbsp;
      <label for="radioCheck">Radiological</label>
      <input type="checkbox" id="radioCheck"/>
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
      &nbsp;
      <button type="button" id="aboutBtn">About</button>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="tract.shear.js"></script>
  </body>
</html>
