<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Allen JSON + PNG atlas (multi-channel microscopy)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      #panel {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      #url {
        min-width: 26rem;
        flex: 1 1 26rem;
      }
      #channels {
        display: flex;
        flex-wrap: wrap;
        gap: 0.15rem 0.75rem;
        max-height: 4.5rem;
        overflow-y: auto;
        padding: 0.2rem 0;
      }
      #channels label {
        font-size: 0.8rem;
        white-space: nowrap;
      }
      #status {
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="panel">
        <input
          id="url"
          type="text"
          value="https://imsc.allencell.org/assets/COMP_crop_M1-M2_atlas.json"
        />
        <button id="describe" type="button">Read channels</button>
        <button id="load" type="button" disabled>Load selected</button>
        <label for="files">or pick local files</label>
        <input id="files" type="file" multiple accept=".json,.png" />
        <label for="opacity">Overlay opacity</label>
        <input
          id="opacity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.5"
        />
        <label for="clipCheck">Clip</label>
        <input type="checkbox" id="clipCheck" />
        <label for="clipOverlaysCheck">Clip overlays</label>
        <input type="checkbox" id="clipOverlaysCheck" />
        <label for="zoom">3D zoom</label>
        <input
          id="zoom"
          type="range"
          min="0.5"
          max="4"
          step="0.05"
          value="1"
        />
        <label for="webgpuCheck">WebGPU</label>
        <input type="checkbox" id="webgpuCheck" checked />
      </div>
      <div id="channels"></div>
      <div id="status">&nbsp;</div>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="./allen.atlas.js"></script>
  </body>
</html>
