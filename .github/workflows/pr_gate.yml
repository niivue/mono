name: PR Gate

on:
  push:
    branches: [main]
  # Every PR, including one stacked on another PR's branch; `edited` re-runs
  # the gate when a PR is retargeted by hand, e.g. to main before its base
  # merges (#487). GitHub's automatic retarget does not send `edited`.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  # A title or body edit gets its own group, so it cannot cancel a real run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'edited' && !github.event.changes.base) && '-edit' || '' }}
  cancel-in-progress: true

jobs:
  check:
    # A skipped title/body-edit run gets its own check name, so it never
    # replaces this check's real result on the PR.
    name: ${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Lint, Typecheck, Test (edit, skipped)' || 'Lint, Typecheck, Test' }}
    # An `edited` event counts only when the base branch changed (a retarget).
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # Generate ipyniivue's widget.js before pixi installs the package
      # in editable mode. widget.js is gitignored and bundled by codegen;
      # hatchling's force-include entry for it would otherwise fail the
      # editable install below.
      - name: Codegen (ipyniivue)
        run: bunx nx run ipyniivue:codegen

      # A public NiiVue API change must commit its regenerated bindings.
      - name: Check ipyniivue bindings are committed
        run: git diff --exit-code -- packages/ipyniivue/api.generated.json packages/ipyniivue/src/ipyniivue/_generated.py packages/ipyniivue/src/ipyniivue/static/_widget.template.js

      # Pixi provisions the Python dev env used by ipyniivue's Nx
      # targets (ruff, mypy, pytest, hatchling/python-build). The Jupyter
      # stack lives in the separate `notebook` env and is not installed here.
      # Cached across runs by prefix-dev/setup-pixi.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: packages/ipyniivue/pyproject.toml
          environments: dev
          cache: true

      - name: Lint
        run: bunx nx run-many -t lint

      - name: Typecheck
        run: bunx nx run-many -t typecheck

      - name: Test
        run: bunx nx run-many -t test

      - name: Packed-consumer smoke test (niivue)
        run: bunx nx run niivue:smoke

      # Catches broken imports and missing demo assets before merge; the
      # Pages workflow builds the examples only after a push to main. It
      # empties packages/niivue/dist, so keep it after the steps that use it.
      - name: Build demos (niivue)
        run: bun run --cwd packages/niivue build:examples

      - name: Demo checks (niivue)
        run: bun run --cwd packages/niivue check:demos

      - name: Notebook hygiene
        run: bun .github/scripts/check-notebook-hygiene.ts

      - name: README notebook paths
        run: bun .github/scripts/check-readme-notebook-paths.ts

      - name: Release helper tests
        run: bun test ./.github/scripts/npm-release-projects.test.ts

      # Posts the coverage table (including files no test loaded) and fails
      # when loaded-file line or function coverage drops below the floors in
      # the coverage:check script of packages/niivue/package.json.
      - name: Coverage summary (niivue)
        if: always()
        run: bun run --cwd packages/niivue coverage:check
