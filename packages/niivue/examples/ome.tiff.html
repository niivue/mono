<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>OME-TIFF, ImageJ and plain TIFF stacks</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      #panel {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      #url {
        min-width: 18rem;
        flex: 1 1 18rem;
      }
      #channels {
        display: flex;
        flex-wrap: wrap;
        gap: 0.15rem 0.75rem;
        padding: 0.2rem 0;
      }
      #channels label {
        font-size: 0.8rem;
        white-space: nowrap;
      }
      /* Keep each checkbox glued to its own label when the row wraps. */
      .pair {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        white-space: nowrap;
      }
      #credit {
        font-size: 0.75rem;
        opacity: 0.8;
      }
      #status {
        font-size: 0.8rem;
      }
      #download {
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="panel">
        <label for="source">File</label>
        <select id="source">
          <option value="ome">OME-TIFF, 3 channels</option>
          <option value="imagej">ImageJ hyperstack, 2 channels</option>
          <option value="plain">Plain TIFF stack, 1 channel</option>
        </select>
        <label for="compression">Compression</label>
        <select id="compression">
          <option value="none">None</option>
          <option value="packbits">PackBits</option>
          <option value="deflate">Deflate</option>
        </select>
        <button id="generate" type="button">Generate</button>
        <a id="download" href="" download="" hidden>Save this file</a>
        <label for="file">or open a .tif</label>
        <input id="file" type="file" accept=".tif,.tiff" />
        <label for="sample">or a public file</label>
        <select id="sample"></select>
        <input id="url" type="text" placeholder="or a URL to a .ome.tif" />
        <button id="fetchUrl" type="button">Fetch</button>
        <label for="opacity">Overlay opacity</label>
        <input
          id="opacity"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.5"
        />
        <span class="pair">
          <label for="clipCheck">Clip</label>
          <input type="checkbox" id="clipCheck" />
        </span>
        <span class="pair">
          <label for="clipOverlaysCheck">Clip overlays</label>
          <input type="checkbox" id="clipOverlaysCheck" />
        </span>
        <label for="zoom">3D zoom</label>
        <input
          id="zoom"
          type="range"
          min="0.5"
          max="4"
          step="0.05"
          value="1"
        />
        <span class="pair">
          <label for="webgpuCheck">WebGPU</label>
          <input type="checkbox" id="webgpuCheck" checked />
        </span>
      </div>
      <div id="credit"></div>
      <div id="channels"></div>
      <button id="load" type="button" disabled>Load selected channels</button>
      <div id="status">&nbsp;</div>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="./ome.tiff.js"></script>
  </body>
</html>
