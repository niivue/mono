<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiiVue Chunk Streaming (HTTP range + OME-Zarr)</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --bg: #090b0b;
        --panel: #111514;
        --line: #26302d;
        --muted: #91a099;
        --text: #edf4f1;
        --cyan: #7ad7d1;
        --green: #9cdc85;
        --amber: #e2b85f;
        --red: #ef8f7b;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }

      header {
        min-height: 44px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, #22483d);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 14px;
      }

      header h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 560;
        white-space: nowrap;
      }

      header .control {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      header select,
      header input {
        background: #171d1b;
        border: 1px solid #2f3a36;
        color: var(--text);
        border-radius: 4px;
        font-size: 0.78rem;
      }

      header select {
        padding: 3px 8px;
      }

      header select:disabled {
        opacity: 0.5;
      }

      header input[type='text'] {
        width: 92px;
        padding: 3px 7px;
        font-family: ui-monospace, monospace;
      }

      header input[type='checkbox'] {
        margin: 0 3px 0 0;
      }

      header button {
        background: #17201d;
        border: 1px solid #34423d;
        color: var(--text);
        padding: 3px 9px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.78rem;
      }

      header button:hover {
        border-color: var(--cyan);
      }

      header .links {
        margin-left: auto;
      }

      header .links a {
        color: var(--cyan);
        margin-left: 12px;
        text-decoration: none;
        font-size: 0.85rem;
      }

      main {
        position: relative;
        min-height: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        outline: none;
      }

      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        box-sizing: border-box;
        width: min(410px, calc(100vw - 24px));
        border: 1px solid rgba(122, 215, 209, 0.28);
        background: rgba(5, 8, 8, 0.78);
        border-radius: 6px;
        padding: 10px 12px;
        pointer-events: auto;
        cursor: grab;
        touch-action: none;
        user-select: none;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.55;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
      }
      .hud.dragging {
        cursor: grabbing;
      }

      .hud .title {
        color: var(--text);
        font-weight: 700;
        margin-bottom: 4px;
      }

      .hud .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-top: 1px solid rgba(145, 160, 153, 0.14);
        padding-top: 3px;
        margin-top: 3px;
      }

      .hud .key {
        color: var(--muted);
      }

      .hud .ok {
        color: var(--green);
      }

      .hud .warn {
        color: var(--amber);
      }

      .hud .bad {
        color: var(--red);
      }

      .strip {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: min(320px, calc(50vw - 24px));
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
        pointer-events: none;
      }

      .strip span {
        height: 6px;
        border-radius: 1px;
        background: #18211e;
        border: 1px solid #293631;
      }

      .strip span.hit {
        background: var(--green);
        border-color: var(--green);
      }

      /* Streaming progress badge. The octree replans as the crosshair moves or
         the zoom changes, and at high zoom the newly relevant bricks can take
         seconds to arrive over the wire -- during which the view is legitimately
         busy rather than broken. Say so, opposite the HUD so neither covers the
         other. */
      .loading {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        box-sizing: border-box;
        min-width: 190px;
        border: 1px solid rgba(122, 215, 209, 0.28);
        background: rgba(5, 8, 8, 0.82);
        border-radius: 6px;
        padding: 8px 11px;
        pointer-events: none;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.4;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
        opacity: 0;
        visibility: hidden;
        transition: opacity 180ms ease;
      }

      .loading.busy {
        opacity: 1;
        visibility: visible;
      }

      .loading-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        gap: 2px;
      }

      .loading-label {
        color: var(--text);
      }

      .loading-count {
        color: var(--muted);
        font-size: 0.66rem;
      }

      .loading-bar {
        display: block;
        height: 3px;
        margin-top: 2px;
        border-radius: 2px;
        background: #1d2724;
        overflow: hidden;
      }

      .loading-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--cyan);
        transition: width 160ms linear;
      }

      .spinner {
        flex: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        border: 2px solid rgba(122, 215, 209, 0.25);
        border-top-color: var(--cyan);
        animation: spin 720ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* The badge is the one piece of feedback a user with reduced-motion still
         needs, so drop the rotation rather than the element. */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
        .loading,
        .loading-fill {
          transition: none;
        }
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #101412;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }

      .fallback[aria-hidden='false'] {
        display: flex;
      }

      @media (max-width: 900px) {
        header {
          align-items: flex-start;
          max-height: 38vh;
          overflow-y: auto;
        }

        header .control {
          width: 100%;
          justify-content: space-between;
        }

        header select,
        header input[type='text'] {
          max-width: 170px;
        }

        header .links {
          width: 100%;
          margin-left: 0;
          overflow-x: auto;
          padding-bottom: 3px;
          white-space: nowrap;
        }

        .hud {
          right: 12px;
          width: auto;
          font-size: 0.66rem;
        }

        .strip {
          left: 12px;
          right: 12px;
          width: auto;
          grid-template-columns: repeat(8, minmax(0, 1fr));
        }

        /* The HUD spans the full width at the top here and the chunk strip the
           full width at the bottom, so the badge sits just above the strip. */
        .loading {
          right: 12px;
          bottom: 30px;
          min-width: 0;
          font-size: 0.66rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NiiVue Chunk Streaming</h1>
      <span class="control">
        <label for="source">Source</label>
        <select id="source">
          <option value="synthetic" selected>synthetic range shard</option>
          <option value="stent">stent OME-Zarr</option>
          <option value="pawpawsaurus">pawpawsaurus OME-Zarr</option>
          <option value="richtmyer_meshkov">richtmyer-meshkov OME-Zarr</option>
          <option value="chameleon">chameleon OME-Zarr (uint16)</option>
          <option value="kingsnake">kingsnake OME-Zarr (uint8)</option>
          <option value="stag_beetle">stag beetle OME-Zarr (uint16)</option>
          <option value="hoa_heart">HOA human heart OME-Zarr 0.4 (uint16)</option>
        </select>
      </span>
      <span class="control">
        <label for="level">Level</label>
        <select id="level" title="Pyramid levels present on disk">
          <option value="" selected>n/a</option>
        </select>
      </span>
      <span class="control">
        <label for="plan">Plan</label>
        <select id="plan"
          title="Budget plan: the policy that shapes the octree. focus = finest at the crosshair; uniform = finest level that fits the whole volume, ignores the crosshair; interactive = a smaller brick budget for smooth rotate/zoom.">
          <option value="focus">focus (crosshair)</option>
          <option value="uniform" selected>uniform (whole volume)</option>
          <option value="interactive">interactive (fewer bricks)</option>
        </select>
      </span>
      <span class="control">
        <label for="layout">Layout</label>
        <select id="layout">
          <option value="3" selected>multiplanar</option>
          <option value="4">render</option>
          <option value="0">axial</option>
          <option value="1">coronal</option>
          <option value="2">sagittal</option>
        </select>
      </span>
      <span class="control">
        <label for="colormap">Colormap</label>
        <select id="colormap">
          <option value="gray" selected>gray</option>
          <option value="viridis">viridis</option>
          <option value="hot">hot</option>
          <option value="plasma">plasma</option>
          <option value="turbo">turbo</option>
        </select>
      </span>
      <span class="control">
        <label for="window">Window</label>
        <input id="window" type="text" value="24,210" />
      </span>
      <span class="control">
        <label for="zoom">Zoom <span id="zoomVal">1.0x</span></label>
        <input id="zoom" type="range" min="1" max="8" step="0.1" value="1"
          title="Zoom the 2D views and restrict the 3D block outlines to the focused region" />
      </span>
      <span class="control">
        <label for="explode">explode <span id="explodeVal">1.00x</span></label>
        <input id="explode" type="range" min="1" max="3" step="0.05" value="1"
          title="Uniformly spread the chunk bricks apart in x, y and z (1.00x = no gap)" />
      </span>
      <span class="control">
        <label for="samples">samples <span id="samplesVal">2.0</span></label>
        <input id="samples" type="range" min="1" max="4" step="0.5" value="2"
          title="Ray samples per voxel in the 3D fine march. Higher converges the ray integral at a linear cost in fill rate. It does not remove the concentric ringing (that is in the data, not the sampling)" />
      </span>
      <span class="control">
        <label for="gamma">gamma <span id="gammaVal">1.00</span></label>
        <input id="gamma" type="range" min="0.5" max="3" step="0.05" value="1"
          title="Display gamma for the 3D render. Raises each sample's classified RGB to 1/gamma, so above 1 brightens. Alpha is untouched, so occlusion is unchanged. It also narrows the gap between a coarse LOD brick and a fine one, since mean-downsampled data classifies darker" />
      </span>
      <span class="control">
        <label for="lodComp">LOD comp <span id="lodCompVal">0.080</span></label>
        <input id="lodComp" type="range" min="0" max="0.2" step="0.005" value="0.08"
          title="Per-level brightness compensation for coarse multi-LOD bricks. A brick from pyramid level L is lifted by exponent 1 - c*log2(k), where k is its linear downsample factor, so each pyramid level costs one fixed step. Averaging voxels destroys the correlation between a sample's colour and its opacity, and front-to-back compositing weights colour by opacity, so a coarse brick integrates darker than the fine data it stands in for. 0 disables. Fine-level and non-chunked draws are unaffected at any setting" />
      </span>
      <span class="control">
        <label for="lodOpacity">LOD opacity <span id="lodOpacityVal">0.00</span></label>
        <input id="lodOpacity" type="range" min="0" max="0.5" step="0.01" value="0"
          title="Per-level OPACITY compensation for coarse multi-LOD bricks. Scales a brick's step-size opacity exponent by 1 + c*(k-1). The march already assumes a coarse voxel is homogeneous; where it is not, the true transmittance is lower, so the brick renders too see-through. Off by default: measured, raising it makes dense structure worse (its alpha is already right, and inflating it front-loads the march onto nearer, dimmer samples). Use LOD comp first; reach for this only if coarse bricks look too transparent rather than too dark" />
      </span>
      <span class="control">
        <label for="interp">Interp</label>
        <select id="interp"
          title="Texture reconstruction in the 3D fine march. linear = hardware trilinear (C0: leaves a blocky texel staircase along band edges). cubic B-spline = 8-tap C2 reconstruction (smooth, ~1.9x fragment cost). Opt-in; linear is the default. vox.interp.html has the side-by-side A/B, a benchmark and a figure export">
          <option value="linear" selected>linear</option>
          <option value="cubic">cubic B-spline</option>
        </select>
      </span>
      <span class="control">
        <label for="illum">illum <span id="illumVal">0.00</span></label>
        <input id="illum" type="range" min="0" max="1" step="0.05" value="0"
          title="3D RENDER ONLY -- set Layout to `render` to see any of the three lighting sliders. Matcap illumination, lit from the precomputed gradient texture. 0 leaves the stream UNLIT, which is the interesting default here: an unlit brick skips its gradient pass entirely, so bricks arrive faster and explode does not flood the pipeline. Raising it off 0 turns the gradient on for every brick, which evicts and re-streams the whole working set once (watch requested/completed and the cache row). Moving it within the non-zero range after that is free" />
      </span>
      <span class="control">
        <label for="gradOpacity">grad opacity <span id="gradOpacityVal">0.00</span></label>
        <input id="gradOpacity" type="range" min="0" max="1" step="0.05" value="0"
          title="3D render only. Suppress homogeneous interior by the gradient magnitude (alpha *= magnitude ^ 8c), so the volume reads as a set of surfaces rather than a fog. Needs the same gradient texture as illum. It is also the most expensive setting on this page: emptying the interior stops rays terminating early, so every ray marches the full depth. Measured on mni152, 2.9 -> 13.4 ms per frame on WebGL2" />
      </span>
      <span class="control">
        <label for="silhouette">silhouette <span id="silhouetteVal">0.00</span></label>
        <input id="silhouette" type="range" min="0" max="0.95" step="0.05" value="0"
          title="3D render only. Fade material whose gradient normal faces the camera, leaving the rim where the surface turns away (the Fresnel term of a non-photorealistic volume render). Needs the same gradient texture as illum. On exploded bricks this is the one to watch for halo correctness: with a halo the cut faces stay unlit and a brick's rim follows the specimen; the default synthetic shard source has halo 0, so its rims outline the brick boxes instead -- switch to an OME-Zarr source for the positive case" />
      </span>
      <span class="control">
        <label for="blocks">
          <input id="blocks" type="checkbox" />
          blocks
        </label>
      </span>
      <span class="control">
        <label for="crosshair"
          title="Show the 3D crosshair (its centre gap is sized to the scene, so it stays open on micron-scale stores)">
          <input id="crosshair" type="checkbox" checked />
          crosshair
        </label>
      </span>
      <button id="reload" type="button">reload</button>
      <div class="links">
        <a href="./index.html">Examples</a>
        <a href="?backend=webgpu">WebGPU</a>
        <a href="?backend=webgl2">WebGL2</a>
      </div>
    </header>
    <main>
      <canvas id="nv-canvas" aria-label="Client-side HTTP Range volume"></canvas>
      <div class="hud" id="hud">Loading...</div>
      <div class="strip" id="chunkStrip" aria-hidden="true"></div>
      <div class="loading" id="loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span class="loading-body">
          <span class="loading-label" id="loadingLabel">Loading blocks</span>
          <span class="loading-count" id="loadingCount" aria-hidden="true"></span>
          <span class="loading-bar" aria-hidden="true"
            ><span class="loading-fill" id="loadingFill"></span
          ></span>
        </span>
      </div>
      <div class="fallback" id="fallback" aria-hidden="true"></div>
    </main>
    <script type="module" src="range.js"></script>
  </body>
</html>
