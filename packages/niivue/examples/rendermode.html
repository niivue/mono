<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Volume Render Mode</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <label for="modeSelect"
        title="what the 3D render tile draws: volumeRenderMode, plus matcap lighting for the Matcap preset"
        >Render mode</label
      >
      <select id="modeSelect">
        <option value="volume">Volume</option>
        <option value="matcap">Matcap</option>
        <option value="maximum">Maximum</option>
        <option value="slices" selected>Slices</option>
      </select>
      &nbsp;
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <label
        for="tissueOpacity"
        title="opacity of the GM/WM/CSF tissue maps over the MNI152 template"
        >Tissue opacity</label
      >
      <input type="range" id="tissueOpacity" min="0" max="100" value="100" />
      &nbsp;
      <label
        title="volumeIsAlphaClipDark: drop voxels the colormap made fully transparent. Off, a plane is a solid slab; on, only tissue is drawn and the planes behind show through."
        ><input type="checkbox" id="darkCheck" />Clip Dark</label>
      &nbsp;
      <label for="cerebellumSelect">Cerebellum</label>
      <select id="cerebellumSelect"></select>
      &nbsp;
      <label for="colorBtn">Background</label>
      <input type="color" id="colorBtn" value="#808080" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="rendermode.js"></script>
  </body>
</html>
