<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiiVue - whole-slide demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #1c1c1f; color: #e8e8ea; }
      header { display: flex; gap: 0.5rem; align-items: center; padding: 0.5rem 1rem; flex-wrap: wrap; font-size: 0.85rem; }
      header select { max-width: 22rem; }
      header .backend { margin-left: auto; }
      main { flex: 1; min-height: 0; position: relative; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { font-size: 0.85rem; opacity: 0.8; }
      #hud { position: absolute; top: 0.75rem; left: 0.75rem; padding: 0.5rem 0.75rem; background: rgba(5, 8, 8, 0.79); border: 1px solid rgba(116, 212, 207, 0.28); border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34); font: 0.72rem/1.5 ui-monospace, monospace; white-space: pre; pointer-events: none; }
      #hud:empty { display: none; }
      #credit { position: absolute; bottom: 0.5rem; right: 0.75rem; max-width: 60%; padding: 0.25rem 0.5rem; background: rgba(5, 8, 8, 0.79); border-radius: 4px; font-size: 0.75rem; }
      #credit:empty { display: none; }
      #credit a { color: inherit; }
      dialog { background: #2a2a2e; color: inherit; border: 1px solid #555; border-radius: 6px; width: min(48rem, 90vw); }
      dialog input { width: 100%; box-sizing: border-box; margin: 0.5rem 0; }
      dialog p { margin: 0; text-align: end; }
    </style>
  </head>
  <body>
    <header>
      <strong>nv-ext-tile</strong>
      <label>Slide <select id="source"></select></label>
      <input id="files" type="file" multiple hidden />
      <label id="series" hidden>Series <select id="slides"></select></label>
      <label>Level <select id="level"><option value="auto">auto LOD</option></select></label>
      <label title="Linear blends neighbouring pixels; nearest shows each source pixel as a square">Filter <select id="filter" autocomplete="off"><option value="linear">linear</option><option value="nearest">nearest</option></select></label>
      <label title="Scale bar from the slide's pixel spacing (none when unknown)"><input id="scaleBar" type="checkbox" checked autocomplete="off" /> Scale bar</label>
      <label title="Apply the slide's ICC profile (sRGB display)"><input id="icc" type="checkbox" checked autocomplete="off" /> Colour management</label>
      <label title="Outline each drawn tile"><input id="grid" type="checkbox" autocomplete="off" /> Grid</label>
      <label title="Show or hide the info panel (I)"><input id="hudToggle" type="checkbox" checked autocomplete="off" /> HUD</label>
      <span id="status">Pick a slide.</span>
      <span class="backend">
        <label>Backend <select id="backend"><option value="webgpu">WebGPU</option><option value="webgl2">WebGL2</option></select></label>
        <label title="Multisample anti-aliasing (reloads the page)"><input id="aa" type="checkbox" /> AA</label>
        <label title="Draw at the display's pixel ratio (off: one canvas pixel per CSS pixel)"><input id="hidpi" type="checkbox" checked autocomplete="off" /> HiDPI</label>
      </span>
    </header>
    <main>
      <canvas id="canvas"></canvas>
      <div id="hud"></div>
      <div id="credit"></div>
    </main>
    <dialog id="customDialog">
      <form method="dialog">
        <label>Tiled TIFF / SVS, DICOM-WSI manifest (.json), OME-Zarr store (.zarr or a path ending in /) or Deep Zoom (.dzi) URL. The server must support CORS (and Range, except for DZI).
          <input id="customUrl" type="text" inputmode="url" required />
        </label>
        <p>
          <button type="button" id="customCancel">Cancel</button>
          <button type="submit" value="open">Open</button>
        </p>
      </form>
    </dialog>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
