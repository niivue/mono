<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NiiVue Slide in 3D (MNI152 space)</title>
    <link rel="icon" href="data:," />
    <!-- Intentionally NOT loading /niivue.css — its global rules
         (`body { position: absolute }`, `div { display: table-row }`,
         `canvas { position: absolute; width: 100%; height: 100% }`)
         escape every container and break block layouts on this page.
         This page linked "./niivue.css", which resolved under /examples/ and had
         always 404'd, so it has never actually been styled by it. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07100d;
        color: #e6f2ee;
        font: 13px/1.4 ui-monospace, monospace;
      }
      /* Toolbar row on top (wraps on narrow screens), canvas below it, so the
         HUD over the canvas never covers the controls. */
      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
        padding: 6px 10px;
      }
      #wrap {
        position: relative;
        min-height: 0;
      }
      #gl {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
      #help {
        position: absolute;
        bottom: 10px;
        left: 10px;
        opacity: 0.7;
      }
      #help a {
        color: #7fd9cd;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <label for="lodSel">LOD</label>
      <select
        id="lodSel"
        title="Slide pyramid level: auto follows the camera; picking a level pins it"
      >
        <option value="auto" selected>auto</option>
      </select>
      <button id="drawBtn" type="button">Draw: off</button>
      <select id="toolSel" title="Drawing mode">
        <option value="pen">Pen</option>
        <option value="eraser">Eraser</option>
        <option value="bucket">Fill</option>
        <option value="filled">Filled pen</option>
        <option value="wand">Magic wand</option>
        <option value="vector">Vector (SVG)</option>
      </select>
      <select id="labelSel" title="Pen label">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
      <button id="undoBtn" type="button">Undo</button>
      <button id="clearBtn" type="button">Clear</button>
      <button id="svgBtn" type="button" title="Export vector annotations as SVG">SVG</button>
      <label for="backendSelect">Backend</label>
      <select id="backendSelect">
        <option value="webgpu">WebGPU</option>
        <option value="webgl2">WebGL2</option>
      </select>
      <label for="aaSelect">Anti-alias</label>
      <select id="aaSelect" title="Multisample anti-aliasing (reloads the page)">
        <option value="off">off</option>
        <option value="on">on</option>
      </select>
      <label id="retinaControl" for="retina" title="Draw at the display's native pixel ratio, or in CSS pixels" hidden>
        <input id="retina" type="checkbox" checked />
        Retina
      </label>
    </div>
    <div id="wrap">
      <canvas id="gl"></canvas>
      <div id="hud">loading…</div>
      <div id="help">
        <a href="./index.html">&lsaquo; Examples</a> &nbsp;|&nbsp;
        drag to orbit · wheel to zoom · press "d" to draw on the slide (u undo · c clear)
      </div>
    </div>
    <script type="module" src="./slide3d.js"></script>
  </body>
</html>
