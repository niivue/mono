<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue - Cinematic rendering</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      #view { flex: 1; min-height: 0; position: relative; }
      #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      footer { display: flex; justify-content: space-between; gap: 12px; }
      #controls { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px; font-size: 12px; }
      #controls label { display: inline-flex; align-items: center; gap: 4px; }
      #controls input[type='range'] { width: 90px; }
    </style>
  </head>
  <body>
    <header>
      <select id="modeSelect">
        <option value="classic">Classic</option>
        <option value="cinematic" selected>Cinematic</option>
      </select>
      <select id="volumeSelect"></select>
      <select id="labelSelect" hidden title="How the segmentation colours the render">
        <option value="only">labels only</option>
        <option value="unlabeled">labels + unlabeled</option>
        <option value="none">no labels</option>
      </select>
      <select id="tfSelect">
        <option value="cr_default" title="Greyscale over the scan's own intensity range, for scans that are not CT">default</option>
        <option value="cr_skin_bone">skin + bone</option>
        <option value="cr_bone">bone</option>
        <option value="cr_angio">angio</option>
        <option value="cr_angio_1d">angio (1D, no gradient)</option>
        <option value="cr_ct_mod">CT (label-modulated)</option>
        <option value="cr_t1">T1 (label-calibrated)</option>
        <option value="cr_t1_mod">T1 (label-modulated)</option>
      </select>
      <label for="clipSelect">Clip</label>
      <select id="clipSelect">
        <option>0</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
      </select>
      <label for="cutawayCheck">Cutaway</label>
      <input type="checkbox" id="cutawayCheck" />
      <input type="color" id="colorBtn" value="#000000" title="Background color" />
      <label for="aaCheck" title="Antialiasing smooths jagged edges of meshes and the crosshair at some cost in speed (the cinematic image smooths itself as it refines)">AA</label>
      <input type="checkbox" id="aaCheck" checked title="Antialiasing smooths jagged edges of meshes and the crosshair at some cost in speed (the cinematic image smooths itself as it refines)" />
      <label for="stochasticCheck" title="Trace shadows and ambient occlusion from one sample per ray per frame: about 2.5x as fast per frame, noisier per frame, same final image">Fast light</label>
      <input type="checkbox" id="stochasticCheck" title="Trace shadows and ambient occlusion from one sample per ray per frame: about 2.5x as fast per frame, noisier per frame, same final image" />
      <label for="webgpuCheck" title="NiiVue backend (WebGL2 cinematic needs EXT_color_buffer_float, else it draws the classic render)">WebGPU</label>
      <input type="checkbox" id="webgpuCheck" />
      <button type="button" id="saveBtn">Save PNG</button>
    </header>
    <div id="controls"></div>
    <main id="view">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">
      <span id="timeText"></span>
      <span id="modeText"></span>
    </footer>
    <script type="module" src="./cinematic/main.js"></script>
  </body>
</html>
