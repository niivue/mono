<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>OME-Zarr multiscale stores</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      #panel {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
      }
      #sample {
        max-width: min(26rem, calc(100vw - 2rem));
      }
      /* A fixed height lets the channel list scroll instead of growing the page. */
      body {
        height: 100%;
      }
      #row {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #channels {
        flex: none;
        overflow: auto;
        padding: 0.25rem 0.5rem;
        font-size: 0.8rem;
        max-width: 45vw;
      }
      #channels summary {
        cursor: pointer;
      }
      #channels label {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        white-space: nowrap;
      }
      #channels .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 2px;
        flex: none;
      }
      #channels input[type='number'] {
        width: 4.5rem;
        margin-left: auto;
      }
      #channels input[type='number']:disabled {
        visibility: hidden;
      }
      #channelList {
        display: grid;
        gap: 0.1rem;
      }
      /* Keep each checkbox glued to its own label when the row wraps. */
      .pair {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        white-space: nowrap;
      }
      /* .pair sets display, which would otherwise override [hidden]. */
      .pair[hidden] {
        display: none;
      }
      #timepoint {
        width: 8rem;
      }
      #status {
        font-size: 0.8rem;
      }
      #canvas-container {
        position: relative;
      }
      #timestamp {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        padding: 0.1rem 0.4rem;
        font: 0.8rem monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="panel">
        <label for="sample">Store</label>
        <select id="sample"></select>
        <label for="level">Level</label>
        <select id="level" disabled></select>
        <label for="view">View</label>
        <select id="view">
          <option value="3" selected>multiplanar</option>
          <option value="0">axial</option>
          <option value="1">coronal</option>
          <option value="2">sagittal</option>
          <option value="4">3D render</option>
        </select>
        <span class="pair" id="timepointPair" hidden>
          <label for="timepoint">Timepoint</label>
          <input id="timepoint" type="range" min="0" value="0" />
          <output id="timepointValue" for="timepoint">0</output>
          <button id="play" type="button">Play</button>
        </span>
        <span class="pair">
          <label for="colorBtn" title="Canvas background">Background</label>
          <input type="color" id="colorBtn" value="#000000" />
        </span>
        <span class="pair">
          <label for="webgpuCheck">WebGPU</label>
          <input type="checkbox" id="webgpuCheck"/>
        </span>
      </div>
      <span class="pair">
        <label for="segUrl">Segmentation</label>
        <input id="segUrl" type="text" placeholder="a label .ome.zarr URL" />
        <button id="addSeg" type="button" disabled>Add</button>
      </span>
    </header>
    <div id="row">
      <main id="canvas-container">
        <canvas id="gl1"></canvas>
        <div id="timestamp" hidden></div>
      </main>
      <details id="channels" open>
        <summary>Channels</summary>
        <label title="How overlapping channels combine">Blend
          <select id="blend">
            <option value="max" selected>max</option>
            <option value="additive">additive</option>
          </select>
        </label>
        <div id="channelList"></div>
      </details>
    </div>
    <footer id="status">&nbsp;</footer>
    <script type="module" src="./src/ome.zarr.js"></script>
  </body>
</html>
