<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue - Affine Manipulation</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <label for="translateX">Overlay X mm</label>
      <input id="translateX" type="range" min="-40" max="40" step="1" value="0" />
      <span id="translateXValue">0</span>
      &nbsp;
      <label for="rotateY">Overlay Y deg</label>
      <input id="rotateY" type="range" min="-30" max="30" step="1" value="0" />
      <span id="rotateYValue">0</span>
      &nbsp;
      <button id="resetAffine" type="button">Reset affine</button>
      &nbsp;
      <label for="underlayColormap">Underlay colormap</label>
      <select id="underlayColormap">
        <option value="gray" selected>gray</option>
        <option value="hot">hot</option>
        <option value="cool">cool</option>
        <option value="winter">winter</option>
        <option value="plasma">plasma</option>
      </select>
      &nbsp;
      <label for="overlayColormap">Overlay colormap</label>
      <select id="overlayColormap">
        <option value="hot" selected>hot</option>
        <option value="gray">gray</option>
        <option value="cool">cool</option>
        <option value="winter">winter</option>
        <option value="plasma">plasma</option>
      </select>
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">NiiVue</footer>
    <script type="module" src="vox.affine.js"></script>
  </body>
</html>
