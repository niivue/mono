<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiiVue Slides (NVSlide tile viewer)</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --bg: #070909;
        --panel: #111715;
        --line: #263530;
        --muted: #98a7a0;
        --text: #edf5f1;
        --cyan: #74d4cf;
        --green: #a2d97b;
        --amber: #e4b45f;
        --red: #ef8d78;
        --ink: #020303;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        min-height: 44px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 92%, #2d3f28);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px 14px;
      }
      header h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 560;
        white-space: nowrap;
      }
      header .control {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .control[hidden] {
        display: none;
      }
      header select {
        background: #171d1b;
        border: 1px solid #2f3d38;
        color: var(--text);
        border-radius: 4px;
        font-size: 0.78rem;
        padding: 3px 8px;
      }
      header button {
        min-width: 30px;
        background: #17201d;
        border: 1px solid #34453e;
        color: var(--text);
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.78rem;
      }
      header button:hover,
      header button:focus-visible {
        border-color: var(--cyan);
        outline: none;
      }
      header .control a {
        color: var(--cyan);
      }
      header input[type='checkbox'] {
        margin: 0 3px 0 0;
      }
      header .back {
        color: var(--cyan);
        text-decoration: none;
        font-size: 0.85rem;
        padding-right: 14px;
        border-right: 1px solid var(--line);
      }
      header .backend {
        margin-left: auto;
      }
      main {
        position: relative;
        min-height: 0;
        background:
          linear-gradient(rgba(116, 212, 207, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(228, 180, 95, 0.04) 1px, transparent 1px),
          var(--ink);
        background-size: 36px 36px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .hud {
        position: absolute;
        top: 12px;
        left: 12px;
        box-sizing: border-box;
        width: min(430px, calc(100vw - 24px));
        border: 1px solid rgba(116, 212, 207, 0.28);
        background: rgba(5, 8, 8, 0.79);
        border-radius: 6px;
        padding: 10px 12px;
        pointer-events: auto;
        cursor: grab;
        touch-action: none;
        user-select: none;
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        line-height: 1.55;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
      }
      .hud.dragging {
        cursor: grabbing;
      }
      .hud .title {
        color: var(--text);
        font-weight: 700;
        margin-bottom: 4px;
      }
      .hud .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border-top: 1px solid rgba(152, 167, 160, 0.14);
        padding-top: 3px;
        margin-top: 3px;
      }
      .hud .key {
        color: var(--muted);
      }
      .hud .ok {
        color: var(--green);
      }
      .hud .warn {
        color: var(--amber);
      }
      .hud .bad {
        color: var(--red);
      }
      .range-log {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: min(560px, calc(100vw - 24px));
        display: grid;
        grid-template-columns: repeat(24, minmax(0, 1fr));
        gap: 3px;
        pointer-events: none;
      }
      .range-log span {
        height: 7px;
        border-radius: 1px;
        background: #151d1a;
        border: 1px solid #293831;
      }
      .range-log span.hit {
        background: var(--green);
        border-color: var(--green);
      }
      .range-log span.pending {
        background: var(--amber);
        border-color: var(--amber);
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #101412;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }
      .fallback[aria-hidden='false'] {
        display: flex;
      }
      body.hud-off .hud,
      body.hud-off .range-log {
        /* opacity, not visibility, so scripts can still read the HUD innerText */
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back" href="./index.html">&lsaquo; Examples</a>
      <h1>NiiVue Slides &mdash; NVSlide tile viewer</h1>
      <span class="control">
        <label for="source">Source</label>
        <select id="source">
          <option value="synthetic" selected>synthetic pyramid</option>
          <option value="dicom-wsi">DICOM-WSI (range)</option>
          <option value="openslide-3dhistech-1">OpenSlide 3DHISTECH-1 (DICOM)</option>
          <option value="openslide-jp2k-33003-1">OpenSlide JP2K-33003-1 (DICOM, JPEG 2000)</option>
          <option value="mono12-jls">Monochrome 12-bit (DICOM, JPEG-LS)</option>
          <option value="mono8-jls-m1">Monochrome 8-bit MONOCHROME1 (DICOM, JPEG-LS near-lossless)</option>
          <option value="openslide-3dhistech-2">OpenSlide 3DHISTECH-2 (DICOM, sparse, split level 0)</option>
          <option value="openslide-leica-4">OpenSlide Leica-4 (DICOM, TILED_SPARSE)</option>
          <option value="openslide-hamamatsu-2">OpenSlide Hamamatsu-2 (DICOM, extended offset table)</option>
          <option value="openslide-jp2k-rct">OpenSlide CMU-1 JP2K RCT (DICOM, JPEG 2000 reversible colour)</option>
          <option value="dzi-highsmith">OpenSeadragon highsmith (DZI, web)</option>
        </select>
        <a href="../demo-ext-tile/" title="TIFF/SVS slides: the tile extension demo">TIFF/SVS</a>
      </span>
      <span class="control">
        <label for="levelMode">Level</label>
        <select id="levelMode">
          <option value="auto" selected>auto LOD</option>
        </select>
      </span>
      <span class="control" id="windowControl" hidden>
        <label for="window">Window</label>
        <input id="window" type="text" title="calMin,calMax (monochrome slides)" size="10" />
      </span>
      <button id="zoomOut" type="button" title="Zoom out">-</button>
      <button id="zoomIn" type="button" title="Zoom in">+</button>
      <button id="fit" type="button" title="Fit view">Fit</button>
      <label class="control" for="showGrid">
        <input id="showGrid" type="checkbox" checked />
        grid
      </label>
      <button id="drawBtn" type="button" title="Draw on the slide (slide-space annotation)">Draw: off</button>
      <label class="control" for="drawTool">tool
        <select id="drawTool" title="Drawing mode">
          <option value="pen">Pen</option>
          <option value="eraser">Eraser</option>
          <option value="bucket">Fill</option>
          <option value="filled">Filled pen</option>
          <option value="wand">Magic wand</option>
          <option value="vector">Vector (SVG)</option>
        </select>
      </label>
      <label class="control" for="wandTol" title="Magic wand colour tolerance">tol
        <input id="wandTol" type="number" min="1" max="200" step="5" value="40" style="width: 3.5em;" />
      </label>
      <label class="control" for="penValue">label
        <select id="penValue" title="Pen label (color from the draw colormap)">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </label>
      <button id="drawUndo" type="button" title="Undo last stroke">Undo</button>
      <button id="drawClear" type="button" title="Clear annotation">Clear</button>
      <button id="exportSvg" type="button" title="Export vector annotations as SVG">SVG</button>
      <button id="hudToggle" type="button" aria-pressed="true" title="Show or hide the overlay panels (I)">HUD: on</button>
      <span class="control backend">
        <label for="backendSelect">Backend</label>
        <select id="backendSelect">
          <option value="webgpu">WebGPU</option>
          <option value="webgl2">WebGL2</option>
        </select>
        <label for="aaSelect">Anti-alias</label>
        <select id="aaSelect" title="Multisample anti-aliasing (reloads the page)">
          <option value="off">off</option>
          <option value="on">on</option>
        </select>
        <label for="slideFilter">Slide</label>
        <select id="slideFilter" autocomplete="off" title="Tile sampling: linear blends neighbouring pixels; nearest shows each source pixel as a square">
          <option value="linear" selected>linear</option>
          <option value="nearest">nearest</option>
        </select>
      </span>
      <label class="control" id="retinaControl" for="retina" title="Draw at the display's native pixel ratio, or in CSS pixels" hidden>
        <input id="retina" type="checkbox" checked />
        Retina
      </label>
    </header>
    <main>
      <canvas id="tileCanvas" tabindex="0"></canvas>
      <canvas
        id="drawOverlay"
        style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;"
      ></canvas>
      <div id="hud" class="hud" aria-live="polite"></div>
      <div id="rangeLog" class="range-log" aria-hidden="true"></div>
      <div id="fallback" class="fallback" aria-hidden="true"></div>
    </main>
    <script>
      {
        const toggle = document.getElementById('hudToggle')
        const key = `hud-off:${location.pathname}`
        const setHud = (off) => {
          document.body.classList.toggle('hud-off', off)
          toggle.setAttribute('aria-pressed', String(!off))
          toggle.textContent = off ? 'HUD: off' : 'HUD: on'
          try {
            localStorage.setItem(key, off ? '1' : '')
          } catch {}
        }
        try {
          setHud(localStorage.getItem(key) === '1')
        } catch {}
        toggle.onclick = () => setHud(!document.body.classList.contains('hud-off'))
        // I (info): NiiVue already binds V, A, C, H/J/K/L, U and D.
        addEventListener('keydown', (e) => {
          if (e.repeat || e.key?.toUpperCase() !== 'I' || e.ctrlKey || e.metaKey || e.altKey) return
          if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return
          toggle.click()
        })
      }
    </script>
    <script type="module" src="slides.js"></script>
  </body>
</html>
