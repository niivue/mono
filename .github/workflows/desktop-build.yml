name: Desktop Build

# Builds the NeuroVue desktop app (apps/desktop) on macOS, Linux and Windows
# and runs its Rust tests. Unsigned: this proves every platform builds; signing
# and release uploads come later.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/**
      - packages/niivue/**
      - packages/uikit/**
      - .github/workflows/desktop-build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so releases are reproducible and the niimath fetch doesn't hit the
  # unauthenticated GitHub API rate limit on shared runners.
  NIIMATH_RELEASE_TAG: v1.0.20261016

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            args: ''
            rust-targets: ''
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
            bundle: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: bun install --frozen-lockfile

      # Through nx, not bare `tauri build`: its ^build builds the workspace
      # niivue and uikit dists the app imports.
      - name: Build app
        run: bunx nx tauri-build neurovue -- ${{ matrix.args }}

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - uses: actions/upload-artifact@v4
        with:
          name: neurovue-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
