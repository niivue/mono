<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@niivue/uikit - Calipers demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee;
        font: 14px/1.4 system-ui, sans-serif; }
      #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
      header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333;
        display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      header b { color: #ffd500; }
      #canvasHolder { flex: 1; position: relative; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      a { color: #ffd500; }
    </style>
    <link rel="stylesheet" href="./demo.css" />
  </head>
  <body>
    <div id="wrap">
      <header>
        <b>UIKit</b>
        <nav><a href="./index.html">controls</a><a href="./calipers.html" aria-current="page">calipers</a><a href="./volume.html">volume</a><a href="./subvolume.html">subvolume</a><a href="./slide.html">slide (3D)</a><a href="./slide-wsi.html">tiles</a><a href="./buttons.html">buttons</a><a href="./standalone.html">standalone</a></nav>
        <label title="2D zoom: the calipers stay on the anatomy, in image space">zoom <input id="zoom" type="range" min="0.5" max="4" step="0.1" value="1" style="vertical-align:middle" /></label>
        <label class="backend">backend <select id="backendSelect">
          <option value="webgl2">webgl2</option>
          <option value="webgpu">webgpu</option>
        </select></label>
      </header>
      <div id="canvasHolder"><canvas id="gl"></canvas></div>
      <footer><span id="help">Click two points to measure; a third click starts over.</span><span id="status" data-state="wait">Waiting for first click</span></footer>
    </div>

    <script type="module">
      import NiiVue, { NIFTI_UNITS_MICRON, SLICE_TYPE } from '@niivue/niivue'
      import { loadDefaultFont, UIKitRulerOverlay } from '@niivue/uikit'
      import { setStatus } from './statusBar.js'
      import { urlParamSelect } from './urlParamSelect.js'

      const params = new URLSearchParams(location.search)
      const backend = params.get('backend') === 'webgpu' ? 'webgpu' : 'webgl2'
      // Wired before anything loads, so the menu works even if loading fails.
      urlParamSelect(document.getElementById('backendSelect'), 'backend', backend)

      const nv = new NiiVue({
        backend,
        backgroundColor: [0.06, 0.06, 0.09, 1],
        sliceType: SLICE_TYPE.AXIAL,
        isRulerVisible: true,
        isColorbarVisible: false,
      })
      const canvas = document.getElementById('gl')
      await nv.attachToCanvas(canvas)
      document.getElementById('backendSelect').value = nv.backend
      await nv.loadVolumes([{ url: '/volumes/torso.nii.gz' }])
      // NIfTI spatial units (low 3 bits of xyzt_units); unknown reads as mm.
      const units = () =>
        ({ 1: 'm', 2: 'mm', [NIFTI_UNITS_MICRON]: 'um' })[nv.volumes[0].hdr.xyzt_units & 7] ?? 'mm'

      const font = await loadDefaultFont()
      const ruler = new UIKitRulerOverlay(font)
      const COLOR = [1, 0.85, 0, 1]
      // Endpoints are kept in world units and projected each frame, so the
      // calipers stay on the anatomy through pan, zoom and resize.
      let pointA = null
      let pointB = null
      const distance = () =>
        Math.hypot(pointB[0] - pointA[0], pointB[1] - pointA[1], pointB[2] - pointA[2])
      // The calipers belong to the slice they were placed on: both ends must be
      // on it, and they hide while another slice is shown (mmToCanvas would
      // project them onto it). Distance to the drawn slice plane, not world z:
      // an oblique volume's axial slice tilts. Half the smallest voxel side
      // stays under half a slice step along any plane normal.
      const onShownSlice = (mm) => {
        const tile = nv.getScreenTiles().find((t) => t.planeNormal)
        if (!tile) return false
        const n = tile.planeNormal
        const p = tile.planePoint
        const off = (mm[0] - p[0]) * n[0] + (mm[1] - p[1]) * n[1] + (mm[2] - p[2]) * n[2]
        return Math.abs(off) < Math.min(...nv.volumes[0].pixDimsRAS.slice(1, 4)) / 2
      }
      nv.registerOverlayRenderer({
        drawOverlay: (frame) => {
          const a = pointA && pointB && onShownSlice(pointA) && nv.mmToCanvas(pointA)
          const b = a && nv.mmToCanvas(pointB)
          if (!b) return
          ruler.setRuler({
            a: [a.x, a.y], b: [b.x, b.y],
            length: distance(),
            units: units(), decimals: 1, sizePx: 22, showTickNumbers: true,
            lineColor: COLOR, textColor: COLOR,
          })
          ruler.drawOverlay(frame)
        },
      })

      // A newly loaded volume (e.g. dropped on the canvas) starts a fresh measurement.
      nv.addEventListener('volumeLoaded', () => {
        pointA = pointB = null
        setStatus('Waiting for first click', 'wait')
      })
      const zoom = document.getElementById('zoom')
      zoom.addEventListener('input', () => {
        const [x, y, z] = nv.pan2Dxyzmm
        nv.pan2Dxyzmm = [x, y, z, Number(zoom.value)]
      })

      // Client coords -> device-pixel coords in the canvas backing store.
      const toDevice = (ev) => {
        const rect = canvas.getBoundingClientRect()
        const sx = canvas.width / rect.width
        const sy = canvas.height / rect.height
        return [(ev.clientX - rect.left) * sx, (ev.clientY - rect.top) * sy]
      }

      // A drag moves the crosshair; only a pointer that barely moved between
      // down and up places an endpoint.
      let downAt = null
      canvas.addEventListener('pointerdown', (ev) => {
        downAt = [ev.clientX, ev.clientY]
      })
      canvas.addEventListener('click', (ev) => {
        if (Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return
        const mm = nv.canvasToMM(...toDevice(ev))
        if (!mm) return
        // A first end on another slice (scrolled since) starts over here.
        if (!pointA || pointB || !onShownSlice(pointA)) {
          pointA = mm
          pointB = null
          nv.drawScene()
          setStatus('Waiting for second click', 'wait')
          return
        }
        pointB = mm
        nv.drawScene()
        setStatus(`${distance().toFixed(1)} ${units()}`, 'ok')
      })
    </script>
  </body>
</html>
