<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@niivue/uikit - Buttons demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee;
        font: 14px/1.4 system-ui, sans-serif; }
      #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; }
      header { padding: 8px 12px; background: #1b1b1b; border-bottom: 1px solid #333;
        display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      header b { color: #ffd500; }
      nav a { color: #9cf; margin-right: 10px; }
      #canvasHolder { flex: 1; position: relative; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      a { color: #ffd500; }
      #status { color: #ffd500; }
      kbd { background: #333; border-radius: 3px; padding: 1px 5px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header>
        <b>UIKit buttons</b>
        <nav><a href="/index.html">blank</a><a href="/volume.html">volume</a><a href="/slide.html">slide</a><a href="/slide-wsi.html">WSI</a><a href="/buttons.html">buttons</a></nav>
        <span>Buttons drawn in the scene as an overlay. Clicks on them never reach the
          viewer; the canvas still drags and scrolls elsewhere. <kbd>1</kbd>-<kbd>5</kbd> click the view buttons from the keyboard.
          <a href="?backend=webgl2">webgl2</a> | <a href="?backend=webgpu">webgpu</a></span>
        <span id="status">loading...</span>
      </header>
      <div id="canvasHolder"><canvas id="gl"></canvas></div>
    </div>

    <script type="module">
      import NiiVue, { SLICE_TYPE } from '@niivue/niivue'
      import { loadDefaultFont, UIKitButtonOverlay } from './src/index.ts'

      const params = new URLSearchParams(location.search)
      const backend = params.get('backend') === 'webgpu' ? 'webgpu' : 'webgl2'
      const status = document.getElementById('status')
      const canvas = document.getElementById('gl')

      const nv = new NiiVue({
        backend,
        backgroundColor: [0.05, 0.05, 0.08, 1],
        sliceType: SLICE_TYPE.MULTIPLANAR,
        isColorbarVisible: false,
      })
      await nv.attachToCanvas(canvas)
      await nv.loadVolumes([{ url: '/volumes/mni152.nii.gz', colormap: 'gray' }])

      const font = await loadDefaultFont()
      // cssUnits: positions and sizes below are CSS pixels; the overlay scales
      // them by the device pixel ratio itself.
      const buttons = new UIKitButtonOverlay(font, { cssUnits: true })
      nv.registerOverlayRenderer(buttons)
      const detach = buttons.attach(nv)

      const say = (msg) => { status.textContent = msg }

      // A row of view buttons along the top-left: auto-sized to their labels.
      const views = [
        ['axial', 'Axial', SLICE_TYPE.AXIAL],
        ['coronal', 'Coronal', SLICE_TYPE.CORONAL],
        ['sagittal', 'Sagittal', SLICE_TYPE.SAGITTAL],
        ['mpr', 'Multiplanar', SLICE_TYPE.MULTIPLANAR],
        ['render', 'Render', SLICE_TYPE.RENDER],
      ]
      let x = 12
      for (const [id, label, sliceType] of views) {
        buttons.addButton({
          id, label, x, y: 12,
          onClick: () => { nv.sliceType = sliceType; say(`${label} view`) },
        })
        x += buttons.getLayout(id).width + 8
      }

      // A fixed-size toggle whose label tracks state, and an accent-styled reset.
      buttons.addButton({
        id: 'colorbar', label: 'Colorbar: off', x: 12, y: 56, width: 140,
        onClick: () => {
          nv.isColorbarVisible = !nv.isColorbarVisible
          buttons.updateButton('colorbar', {
            label: `Colorbar: ${nv.isColorbarVisible ? 'on' : 'off'}`,
          })
        },
      })
      buttons.addButton({
        id: 'reset', label: 'Reset view', x: 160, y: 56,
        style: {
          fill: [0.55, 0.1, 0.12, 0.95],
          hoverFill: [0.68, 0.15, 0.18, 0.97],
          pressedFill: [0.32, 0.05, 0.06, 1],
          border: [1, 0.55, 0.55, 1],
          radius: 14,
        },
        onClick: () => {
          nv.azimuth = 110
          nv.elevation = 10
          nv.pan2Dxyzmm = [0, 0, 0, 1]
          say('view reset')
        },
      })
      buttons.addButton({
        id: 'soon', label: 'Disabled', x: 282, y: 56, enabled: false,
      })

      // Keyboard shortcuts drive the same buttons, with the same press animation.
      addEventListener('keydown', (e) => {
        const i = Number.parseInt(e.key, 10) - 1
        if (views[i]) buttons.click(views[i][0])
      })

      say('ready')
      addEventListener('beforeunload', detach)
    </script>
  </body>
</html>
