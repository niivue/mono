<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Allen JSON + PNG atlas (multi-channel microscopy)</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/niivue.css" />
    <style>
      header {
        display: flex;
        gap: 0.4rem 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      header select {
        max-width: min(22rem, calc(100vw - 2rem));
      }
      /* A fixed height lets the channel list scroll instead of growing the page. */
      body {
        height: 100%;
      }
      #row {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      #channels {
        flex: none;
        overflow: auto;
        padding: 0.25rem 0.5rem;
        font-size: 0.8rem;
        max-width: 45vw;
      }
      #channels summary {
        cursor: pointer;
      }
      #channels label {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        white-space: nowrap;
      }
      #channels .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 2px;
        flex: none;
      }
      #channels input[type='number'] {
        width: 3.5rem;
        margin-left: auto;
      }
      #channels input[type='number']:disabled {
        visibility: hidden;
      }
      #channelList {
        display: grid;
        gap: 0.1rem;
      }
      #location {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <header>
      <label>Dataset <select id="dataset"></select></label>
      <input id="files" type="file" multiple accept=".json,.png" hidden />
      <label title="What a right drag does; with pan/zoom the wheel zooms the slices">Right drag
        <select id="secondaryDrag">
          <option value="3" selected>pan/zoom</option>
          <option value="1">contrast</option>
          <option value="9">windowing</option>
          <option value="2">measurement</option>
        </select>
      </label>
      <label><input type="checkbox" id="clipCheck" /> Clip</label>
      <label><input type="checkbox" id="webgpuCheck" /> WebGPU</label>
      <button id="aboutBtn" type="button">About</button>
    </header>
    <div id="row">
      <main id="canvas-container">
        <canvas id="gl1"></canvas>
      </main>
      <details id="channels" open>
        <summary>Channels</summary>
        <label title="How overlapping channels combine">Blend
          <select id="blend">
            <option value="max" selected>max</option>
            <option value="additive">additive</option>
          </select>
        </label>
        <div id="channelList"></div>
      </details>
    </div>
    <footer id="location">&nbsp;</footer>
    <script type="module" src="./allen.atlas.js"></script>
  </body>
</html>
