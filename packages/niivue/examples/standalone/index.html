<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue - Standalone ES module build</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #303030;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header,
      footer {
        padding: 0.5rem 1rem;
      }
      main {
        flex: 1;
        min-height: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <!--
      No bundler and no node_modules: this page loads the self-contained build
      that `bun run build` writes to dist/standalone/. Copy that folder next to
      the page as niivue/ (or point the map at a CDN copy of it) and map the
      package name once. Every dependency is already inside the folder, and
      its chunks import each other by relative path, so nothing else needs a
      mapping and the folder works from any base URL.

      Serve it locally with: bun run examples:standalone (port 5403)
    -->
    <script type="importmap">
      {
        "imports": {
          "@niivue/niivue": "./niivue/niivue.js"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <label for="sliceType">View</label>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
    </header>
    <main>
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">NiiVue standalone build</footer>
    <script type="module">
      import NiiVue from '@niivue/niivue'

      const nv = new NiiVue({
        backgroundColor: [0.2, 0.2, 0.2, 1],
        isColorbarVisible: true,
      })
      nv.addEventListener('locationChange', (e) => {
        document.getElementById('location').textContent = e.detail.string
      })
      await nv.attachToCanvas(document.getElementById('gl1'))
      const sliceType = document.getElementById('sliceType')
      sliceType.onchange = () => {
        nv.sliceType = Number.parseInt(sliceType.value, 10)
      }
      sliceType.onchange()
      await nv.loadVolumes([{ url: './volumes/mni152.nii.gz' }])
    </script>
  </body>
</html>
