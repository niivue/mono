<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue Font</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <label for="fontSelect">Fonts:</label>
      <select id="fontSelect">
        <option value="" disabled selected hidden></option>
      </select>
      &nbsp;
      <label for="fontSlide">Font Size</label>
      <input type="range" id="fontSlide" min="1" max="20" step="1" value="10" />
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <script type="module" src="font.js"></script>
  </body>
</html>
