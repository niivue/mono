name: Release Preview Comment

# Posts the comment that release-preview.yml renders. That workflow runs on
# pull_request, so on a PR from a fork it holds a read-only token and cannot
# comment. This one runs on workflow_run, in the base repo's context with a
# write token, and never checks out or executes the PR's code: it only
# downloads the rendered markdown and posts it.
on:
  workflow_run:
    workflows: [Release Preview]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Post release preview
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('preview-comment.md', 'utf8')
            const marker = '<!-- nx-release-preview -->'
            const { owner, repo } = context.repo
            const headSha = context.payload.workflow_run.head_sha

            // The PR number was written by the fork's run, so treat it as a
            // claim: only comment if that PR's head is the commit the run
            // actually previewed.
            const issue_number = Number(fs.readFileSync('pr-number.txt', 'utf8').trim())
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`bad PR number in artifact: ${JSON.stringify(issue_number)}`)
              return
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number })
            if (pr.head.sha !== headSha) {
              core.setFailed(`PR #${issue_number} head ${pr.head.sha} does not match run head ${headSha}`)
              return
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              })
            }
