<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>NiiVue - CT</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/niivue.css" />
  </head>
  <body>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      &nbsp;
      <select id="volumeSelect"></select>
      &nbsp;
      <label for="orientCheck">Orient</label>
      <input type="checkbox" id="orientCheck" checked/>
      &nbsp;
      <label for="colormapSelect">Colormap</label>
      <select id="colormapSelect"></select>
      &nbsp;
      <label for="centerSlide" title="window center (level), Hounsfield units">Center</label>
      <input type="range" id="centerSlide" min="-1000" max="1000" step="1" />
      <output id="centerText" for="centerSlide"></output>
      &nbsp;
      <label for="widthSlide" title="window width, Hounsfield units">Width</label>
      <input type="range" id="widthSlide" min="1" max="4000" step="1" />
      <output id="widthText" for="widthSlide"></output>
      &nbsp;
      <label for="darkCheck">Clip Dark</label>
      <input type="checkbox" id="darkCheck">
      &nbsp;
      <label for="webgpuCheck">WebGPU</label>
      <input type="checkbox" id="webgpuCheck"/>
    </header>
    <main id="canvas-container">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="location">NiiVue</footer>
    <script type="module" src="vox.ct.js"></script>
  </body>
</html>
